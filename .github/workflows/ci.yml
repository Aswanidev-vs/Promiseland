name: CI

# Release 0 foundation: checks only. Image publishing to ECR and EC2
# deployment are intentionally deferred to a later release (PRD §11.3).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (Vue 3 + Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The `test` script runs vitest (see frontend/package.json).
      # Bun's built-in `bun test` runner is not compatible with these tests.
      - name: Test
        run: bun run test

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

name: CI

# Pull-request and main-branch gate for PRD §11.3 items 1-5: formatting, static
# analysis, unit and integration tests, the production build, both container
# images, and dependency/image scanning. Items 6-9 (publish to ECR, deploy to
# EC2, post-deploy health check, keep a rollback tag) need a registry and an
# OIDC deploy role this repository does not have yet, so they are absent rather
# than stubbed out.

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          # go.mod pins the exact toolchain, so there is one place to bump.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt these files"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector is part of the gate: realtime/WebSocket code and the
      # SQLite pools are the parts most likely to regress silently.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Scan for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  frontend:
    name: Frontend (Vue + Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      # `build` is `vue-tsc --noEmit && vite build`, so this is the type check
      # and the production build in one step.
      - name: Type check and build
        run: bun run build

      # The `test` script runs vitest. Bun's built-in `bun test` runner is not
      # compatible with these SFC tests.
      - name: Test
        run: bun run test

      # The two ignored advisories are dev-only (tinypool behind vitest 3) and
      # have no fix inside that major; vitest 4 clears them but breaks 16 test
      # files, so the upgrade is tracked separately. Everything else — including
      # every production dependency — must be clean.
      - name: Scan dependency advisories
        run: |
          bun audit --audit-level=high \
            --ignore=GHSA-5gmw-xhrv-c9v3 \
            --ignore=GHSA-85c8-ppgw-ccpr

  images:
    name: Images (build, scan, smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Pinned by digest so the scanner cannot be swapped under us.
      TRIVY: aquasec/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build the API image
        run: docker build --tag promisedland-api:ci backend

      - name: Build the web image
        run: docker build --tag promisedland-web:ci frontend

      # Only fixable findings block: an unfixed base-image CVE is not something
      # a pull request can act on, and gating on it just teaches people to
      # ignore the red run.
      - name: Scan the API image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 promisedland-api:ci

      - name: Scan the web image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 promisedland-web:ci

      # Builds prove the images exist; this proves they start, that the API
      # migrates its database, and that the web image renders its nginx config
      # and reaches the API. A broken entrypoint only shows up here.
      - name: Smoke test the stack
        run: |
          set -eu
          docker network create smoke
          docker run -d --name api --network smoke -v smoke-data:/data \
            -e DATABASE_PATH=/data/promisedland.db \
            -e MEDIA_PATH=/data/media \
            -e SESSION_SECRET=ci-smoke-only \
            promisedland-api:ci
          docker run -d --name web --network smoke -p 8080:80 \
            -e API_UPSTREAM=http://api:8080 \
            promisedland-web:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz | grep -q '"status":"ok"'; then
              echo "stack is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the web image never answered /healthz with a ready API"
          docker logs api || true
          docker logs web || true
          exit 1

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate compose file
        run: docker compose config -q
